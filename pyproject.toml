[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cadlayout"
version = "0.1.0"
description = "Generative surrogate: object set -> 2D room layout -> NURBS CAD"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "shapely>=2.0", "matplotlib", "ezdxf"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
